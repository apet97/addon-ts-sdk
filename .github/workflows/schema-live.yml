name: Live Schema Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths:
      - "addon-sdk/schemas/**"
      - "addon-sdk/src/clockify/generated/**"

permissions:
  contents: read

jobs:
  verify-live-schema:
    runs-on: ubuntu-latest
    # Non-blocking on the pull_request trigger: Clockify's live endpoint is an external dependency,
    # so a PR that touches vendored schemas gets early signal without gating on network flakiness.
    # The scheduled and manual triggers still report their real pass/fail status.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify live Clockify manifest schemas
        run: npm run verify:schema-live
