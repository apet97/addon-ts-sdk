version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Belgrade"
    open-pull-requests-limit: 5
    groups:
      sdk-tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/js"
          - "eslint-config-prettier"
          - "prettier"
          - "tsx"
        update-types:
          - "minor"
          - "patch"
      sdk-runtime:
        patterns:
          - "jose"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Belgrade"
    open-pull-requests-limit: 3

  # The Workers compatibility project has its own lockfile and is not part of
  # the root npm workspace, so it needs a separate update stream.
  - package-ecosystem: "npm"
    directory: "/workers-compat"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "Europe/Belgrade"
    open-pull-requests-limit: 3
    groups:
      workers-tooling:
        patterns:
          - "@cloudflare/vitest-pool-workers"
          - "vitest"
          - "wrangler"
